name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2 (includes Ahk2Exe compiler)
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile ahk-setup.exe
          Start-Process -FilePath .\ahk-setup.exe -ArgumentList "/S" -Wait
          $compiler = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          if (!(Test-Path $compiler)) { throw "Ahk2Exe.exe not found after install" }

      - name: Compile EdgeScroll.exe
        shell: pwsh
        run: |
          & "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe" `
            /in EdgeScroll.ahk /out EdgeScroll.exe `
            /base "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe" /silent verbose
          if (!(Test-Path EdgeScroll.exe)) { throw "Compilation failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeScroll-windows
          path: EdgeScroll.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EdgeScroll.exe
