name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 (from GitHub releases)
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip"
          Invoke-WebRequest -Uri $url -OutFile ahk.zip
          Expand-Archive -Path ahk.zip -DestinationPath ahk

      - name: Compile EdgeScroll.exe
        shell: pwsh
        run: |
          $compiler = (Get-ChildItem -Recurse -Filter Ahk2Exe.exe -Path ahk | Select-Object -First 1).FullName
          if (!$compiler) { throw "Ahk2Exe.exe not found in the AutoHotkey zip" }
          $base = "ahk/AutoHotkey64.exe"
          & $compiler /in EdgeScroll.ahk /out EdgeScroll.exe /base $base /silent verbose
          if (!(Test-Path EdgeScroll.exe)) { throw "Compilation failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeScroll-windows
          path: EdgeScroll.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EdgeScroll.exe
