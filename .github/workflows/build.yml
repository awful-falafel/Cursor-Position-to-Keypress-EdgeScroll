name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2 via Chocolatey
        shell: pwsh
        run: |
          choco install autohotkey.install --version 2.0.19 -y --no-progress
          $hits = Get-ChildItem -Recurse -Filter Ahk2Exe.exe -Path "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData\chocolatey" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$hits) {
            Get-ChildItem -Recurse -Directory -Path "C:\Program Files" -Filter "*AutoHotkey*" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            choco list --local-only
            throw "Ahk2Exe.exe not found after install"
          }
          "AHK2EXE=$($hits.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Compile EdgeScroll.exe
        shell: pwsh
        run: |
          $base = (Get-ChildItem -Recurse -Filter AutoHotkey64.exe -Path "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (!$base) { throw "AutoHotkey64.exe not found" }
          & $env:AHK2EXE /in EdgeScroll.ahk /out EdgeScroll.exe /base $base /silent verbose
          if (!(Test-Path EdgeScroll.exe)) { throw "Compilation failed" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeScroll-windows
          path: EdgeScroll.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EdgeScroll.exe
